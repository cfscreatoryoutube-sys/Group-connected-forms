<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>try{var t=localStorage.getItem("gc_theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Group Connected forms</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apply, report a problem or contact the Group Connected team.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Group Connected">
<meta property="og:title" content="Group Connected forms">
<meta property="og:description" content="Apply, report a problem or contact the Group Connected team.">
<meta property="og:url" content="https://groupconnected.uk/forms.html">
<meta property="og:image" content="https://groupconnected.uk/icon.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GC Inbox">
<script>
/* Only the admin inbox is installable, so fans opening a form link never see an install prompt */
if(/[?&]inbox(&|=|$)/.test(location.search)){var l=document.createElement('link');l.rel='manifest';l.href='/inbox.webmanifest';document.head.appendChild(l)}
</script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6f76;--card:#f4f5f7;--line:#e5e7eb;--ac:#00b896;--acfg:#04382f;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--fg:#f2f2f2;--mut:#9a9aa3;--card:#1a1a20;--line:#2a2a32;--ac:#1ee0bf;--acfg:#04382f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e0e11;--fg:#f2f2f2;--mut:#9a9aa3;--card:#1a1a20;--line:#2a2a32;--ac:#1ee0bf;--acfg:#04382f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.5px;color:inherit;text-decoration:none}
.logo img{width:30px;height:30px}.logo b{color:var(--ac)}
.sp{flex:1}
main{max-width:620px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;line-height:1.2;margin:6px 0 6px;letter-spacing:-.4px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
a{color:var(--ac)}
label.f{display:block;font-weight:600;margin:16px 0 6px}
label.f i{color:var(--ac);font-style:normal;margin-left:3px}
input,textarea,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border:0;border-radius:20px;padding:10px 20px;font-weight:700}
button.p:disabled{opacity:.55;cursor:default}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:7px 14px}
button.d{background:none;color:var(--bad);border:1px solid var(--line);border-radius:20px;padding:7px 14px}
.err{color:var(--bad);min-height:1.4em;margin:12px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.formlist{display:grid;gap:10px;margin-top:18px}
.formlist a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.formlist a:hover{border-color:var(--ac)}
.formlist b{display:block}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 14px;font-weight:600}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.item{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);overflow:hidden}
.item.new{border-left:4px solid var(--ac)}
.row{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:13px 14px;align-items:flex-start}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{color:var(--mut);font-size:13px;white-space:nowrap}
.det{padding:0 14px 14px;border-top:1px solid var(--line)}
.det dl{margin:12px 0}
.det dt{font-weight:600;margin-top:10px}
.det dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts a.s{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:7px 14px;text-decoration:none}
.link{display:flex;gap:8px;align-items:center;margin:8px 0}
.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:24px;font-weight:600;z-index:20;max-width:90vw}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/icon-192.png" alt="" width="30" height="30"><span>Group <b>Connected</b></span></a>
  <span class="sp"></span>
  <span id="hdr"></span>
</header>
<main id="app"><p class="mut">Loading…</p></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ SETTINGS (edit these) ============ */
const firebaseConfig={apiKey:"AIzaSyDfLScvbQ81XZnJcNuyHsl7q4lZwvQQ2BE",authDomain:"group-connected-2f6b0.firebaseapp.com",projectId:"group-connected-2f6b0",appId:"1:609393183506:web:15a4cefdcbf81bcbc341cb",messagingSenderId:"609393183506"};
/* Must match the address in firestore.rules (the /mail rule only allows this one recipient) */
const CEO_EMAIL='GroupConncted@outlook.com';
const SITE='https://groupconnected.uk';

/* Add, remove or reword forms here. Each form gets its own link: forms.html?form=<key>
   Field types: text, email, textarea, select (give options:[...]). Add req:1 to make a field required.
   Don't use a "." in a label. */
const FORMS={
  artist:{title:'Artist or group application',
    intro:'Tell us about you or your group and we’ll get back to you on Discord or by email.',
    fields:[
      {id:'discord',label:'Discord username',type:'text',req:1},
      {id:'name',label:'Artist or group name',type:'text',req:1},
      {id:'label',label:'Label (if you have one)',type:'text'},
      {id:'email',label:'Email',type:'email'},
      {id:'links',label:'Links to your music or socials',type:'textarea'},
      {id:'about',label:'Anything else we should know',type:'textarea'}]},
  label:{title:'Label application',
    intro:'Apply for a label account so your groups and artists can join Group Connected.',
    fields:[
      {id:'discord',label:'Discord username',type:'text',req:1},
      {id:'name',label:'Label name',type:'text',req:1},
      {id:'email',label:'Email',type:'email',req:1},
      {id:'groups',label:'Groups and artists on your label',type:'textarea',req:1},
      {id:'links',label:'Website or socials',type:'text'}]},
  support:{title:'Report a problem',
    intro:'Something broken or someone breaking the rules? Tell us what happened.',
    fields:[
      {id:'discord',label:'Discord username',type:'text',req:1},
      {id:'user',label:'Your Group Connected username',type:'text'},
      {id:'kind',label:'What is this about?',type:'select',options:['Something isn’t working','Report a user','Report a post','Account help','Other'],req:1},
      {id:'what',label:'What happened',type:'textarea',req:1},
      {id:'email',label:'Email',type:'email'}]},
  contact:{title:'Contact the team',
    intro:'Questions, ideas or partnerships. We read everything.',
    fields:[
      {id:'discord',label:'Discord username',type:'text',req:1},
      {id:'email',label:'Email',type:'email'},
      {id:'msg',label:'Your message',type:'textarea',req:1}]}
};
/* ============================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
const INBOX=q.has('inbox');
let auth,db;

function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function ago(ts){const s=Math.max(1,Math.floor((Date.now()-ts)/1000));if(s<60)return 'just now';const m=Math.floor(s/60);if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' h ago';const d=Math.floor(h/24);if(d<7)return d+' d ago';return new Date(ts).toLocaleDateString()}
const formUrl=k=>SITE+'/forms.html?form='+k;

/* ================= PUBLIC: fill in a form ================= */
function renderPublic(){
  document.title='Group Connected forms';
  const key=q.get('form'),f=FORMS[key],app=$('#app');
  if(!f){
    app.innerHTML='<h1>Forms</h1><p class="mut">Choose what you need.</p><div class="formlist">'+
      Object.keys(FORMS).map(k=>`<a href="?form=${k}"><b>${esc(FORMS[k].title)}</b><span class="mut">${esc(FORMS[k].intro)}</span></a>`).join('')+'</div>';
    return;
  }
  document.title=f.title+' – Group Connected';
  app.innerHTML=`<h1>${esc(f.title)}</h1><p class="mut">${esc(f.intro)}</p>
  <form id="fm" novalidate class="card" style="margin-top:16px">
    ${f.fields.map(x=>{
      const id='f_'+x.id,lab=`<label class="f" for="${id}">${esc(x.label)}${x.req?'<i title="Required">*</i>':''}</label>`;
      if(x.type==='textarea')return lab+`<textarea id="${id}" maxlength="2000"></textarea>`;
      if(x.type==='select')return lab+`<select id="${id}"><option value="">Choose…</option>${x.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
      return lab+`<input id="${id}" type="${x.type==='email'?'email':'text'}" maxlength="300" autocomplete="off">`;
    }).join('')}
    <div class="hp" aria-hidden="true"><label>Leave empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
    <p class="err" id="err" role="alert"></p>
    <button class="p" id="go" type="submit">Send response</button>
  </form>`;
  $('#fm').addEventListener('submit',e=>{e.preventDefault();send(key)});
}

async function send(key){
  const f=FORMS[key],err=$('#err'),btn=$('#go');err.textContent='';
  if($('#hp').value)return;
  const last=+(localStorage.getItem('gc_form_ts')||0);
  if(Date.now()-last<30000){err.textContent='Wait a few seconds before sending another response.';return}
  const answers={};
  for(const x of f.fields){
    const el=$('#f_'+x.id),v=el.value.trim();
    if(x.req&&!v){err.textContent='Fill in “'+x.label+'”.';el.focus();return}
    if(x.type==='email'&&v&&!/^\S+@\S+\.\S+$/.test(v)){err.textContent='Enter a valid email address.';el.focus();return}
    if(v)answers[x.label]=v.slice(0,2000);
  }
  btn.disabled=true;btn.textContent='Sending…';
  try{
    const ref=db.collection('submissions').doc();
    const body=Object.keys(answers).map(k=>k+': '+answers[k].slice(0,300)).join('\n');
    const b=db.batch();
    b.set(ref,{form:key,title:f.title,answers,status:'new',ts:Date.now()});
    /* the mail doc uses the same id as the submission, which is what the rules check */
    b.set(db.collection('mail').doc(ref.id),{to:[CEO_EMAIL],message:{
      subject:'Group Connected: new response – '+f.title,
      text:('New response to “'+f.title+'”.\n\n'+body+'\n\nOpen the inbox app: '+SITE+'/forms.html?inbox').slice(0,2800)}});
    await b.commit();
    localStorage.setItem('gc_form_ts',String(Date.now()));
    $('#app').innerHTML=`<h1>Response sent</h1><p class="mut">Thanks. The Group Connected team has it and will reply on Discord or by email.</p><p><a href="?">See other forms</a></p>`;
  }catch(e){
    console.warn(e);
    err.textContent='Couldn’t send your response. Check your connection and try again.';
    btn.disabled=false;btn.textContent='Send response';
  }
}

/* ================= ADMIN: inbox ================= */
let subs=[],filter='new',openId=null,first=true,unsub=null,deferred=null;
const AERR={'auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'Wrong email or password','auth/invalid-email':'Enter a valid email','auth/too-many-requests':'Too many tries. Wait a bit and try again.'};

function startInbox(){
  document.title='GC Inbox';
  if('serviceWorker' in navigator)addEventListener('load',async()=>{try{if(!(await navigator.serviceWorker.getRegistration('/')))await navigator.serviceWorker.register('/sw.js')}catch(e){}});
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;hdr()});
  addEventListener('appinstalled',()=>{deferred=null;hdr()});
  auth.onAuthStateChanged(async u=>{
    if(unsub){unsub();unsub=null}
    subs=[];first=true;hdr();
    if(!u)return renderLogin();
    let ok=false;
    try{ok=(await db.doc('admins/'+u.uid).get()).exists}catch(e){}
    if(!ok)return renderNotAdmin(u);
    listen();
  });
}
function hdr(){
  const h=$('#hdr');if(!INBOX){h.innerHTML='';return}
  const u=auth&&auth.currentUser;
  h.innerHTML=(deferred?'<button class="s" id="inst">Install app</button> ':'')+(u?'<button class="s" id="out">Sign out</button>':'');
  if($('#inst'))$('#inst').onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;hdr()};
  if($('#out'))$('#out').onclick=()=>auth.signOut();
}
function renderLogin(){
  $('#app').innerHTML=`<h1>Admin inbox</h1><p class="mut">Sign in with your Group Connected account.</p>
  <form id="lf" class="card" style="margin-top:16px" novalidate>
    <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <button class="p" type="submit">Sign in</button>
  </form>`;
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();const err=$('#err');err.textContent='';
    try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}
    catch(x){err.textContent=AERR[x.code]||'Couldn’t sign in. Try again.'}
  });
}
function renderNotAdmin(u){
  $('#app').innerHTML=`<h1>No access</h1><p class="mut">${esc(u.email||'This account')} isn’t an admin. Sign in with the CEO or admin account.</p>`;
}
function listen(){
  unsub=db.collection('submissions').orderBy('ts','desc').limit(200).onSnapshot(s=>{
    if(!first)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().status==='new')alertNew(c.doc.data())});
    first=false;
    subs=s.docs.map(d=>({id:d.id,...d.data()}));
    badge();renderInbox();
  },e=>{
    console.warn(e);
    $('#app').innerHTML='<h1>Couldn’t load responses</h1><p class="mut">Check that the new rules from firestore.rules are published in Firebase, then reload.</p>';
  });
}
function alertNew(d){
  toast('New response: '+d.title);
  try{
    if('Notification' in window&&Notification.permission==='granted'&&document.hidden){
      navigator.serviceWorker.ready.then(r=>r.showNotification('New response',{body:d.title,icon:'/icon-192.png',badge:'/favicon-96x96.png',tag:'gc-inbox'}));
    }
  }catch(e){}
}
function badge(){
  const n=subs.filter(s=>s.status==='new').length;
  document.title=(n?'('+n+') ':'')+'GC Inbox';
  try{if(n){navigator.setAppBadge&&navigator.setAppBadge(n)}else{navigator.clearAppBadge&&navigator.clearAppBadge()}}catch(e){}
}
function renderInbox(){
  const nNew=subs.filter(s=>s.status==='new').length,nRep=subs.length-nNew;
  const list=subs.filter(s=>filter==='all'||(filter==='new'?s.status==='new':s.status!=='new'));
  const ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
  $('#app').innerHTML=`<h1>Responses</h1>
  <div class="tabs" role="tablist">
    <button class="${filter==='new'?'on':''}" data-f="new">New (${nNew})</button>
    <button class="${filter==='replied'?'on':''}" data-f="replied">Replied (${nRep})</button>
    <button class="${filter==='all'?'on':''}" data-f="all">All (${subs.length})</button>
  </div>
  ${list.length?list.map(item).join(''):`<div class="card mut">${filter==='new'?'No new responses. Share a form link in Discord to start collecting them.':'Nothing here yet.'}</div>`}
  <details style="margin-top:24px"><summary>Form links for Discord</summary>
    ${Object.keys(FORMS).map(k=>`<div class="link"><span style="min-width:0;flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(FORMS[k].title)}</span><code>${esc(formUrl(k))}</code><button class="s" data-copy="${esc(formUrl(k))}">Copy</button></div>`).join('')}
  </details>
  <details style="margin-top:8px"><summary>Alerts and install</summary>
    <p class="mut">New responses also email ${esc(CEO_EMAIL)}. ${'Notification' in window?'':'This browser can’t show app alerts.'}</p>
    ${'Notification' in window&&Notification.permission==='default'?'<button class="s" id="notif">Turn on alerts while the app is open</button>':''}
    ${ios?'<p class="mut">On iPhone: tap Share, then Add to Home Screen to install.</p>':''}
  </details>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderInbox()});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{openId=openId===b.dataset.id?null:b.dataset.id;renderInbox()});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.st));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));
  if($('#notif'))$('#notif').onclick=async()=>{await Notification.requestPermission();renderInbox()};
}
function item(s){
  const keys=Object.keys(s.answers||{}),prev=keys.length?(s.answers[keys[0]]):'';
  const open=openId===s.id;
  const all=Object.values(s.answers||{}).join(' ');
  const mail=(all.match(/[^\s@]+@[^\s@]+\.[^\s@]+/)||[])[0];
  const dk=keys.find(k=>/discord/i.test(k));
  return `<article class="item ${s.status==='new'?'new':''}">
    <button class="row" data-id="${esc(s.id)}" aria-expanded="${open}">
      <span class="t"><b>${esc(s.title||s.form)}</b><span>${esc(prev)}</span></span><time>${ago(s.ts)}</time>
    </button>
    ${open?`<div class="det"><dl>${keys.map(k=>`<dt>${esc(k)}</dt><dd>${esc(s.answers[k])}</dd>`).join('')}</dl>
      <div class="acts">
        ${s.status==='new'?`<button class="p" data-id="${esc(s.id)}" data-st="replied">Mark replied</button>`:`<button class="s" data-id="${esc(s.id)}" data-st="new">Mark new</button>`}
        ${mail?`<a class="s" href="mailto:${esc(mail)}?subject=${encodeURIComponent('Re: '+(s.title||'Group Connected'))}">Email reply</a>`:''}
        ${dk?`<button class="s" data-copy="${esc(s.answers[dk])}">Copy Discord name</button>`:''}
        <button class="d" data-del="${esc(s.id)}">Delete</button>
      </div></div>`:''}
  </article>`;
}
async function setStatus(id,st){try{await db.doc('submissions/'+id).update({status:st});toast(st==='replied'?'Marked replied':'Marked new')}catch(e){toast('Couldn’t update. Try again.')}}
async function del(id){if(!confirm('Delete this response? This can’t be undone.'))return;try{await db.doc('submissions/'+id).delete();openId=null}catch(e){toast('Couldn’t delete. Try again.')}}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Couldn’t copy')}}

/* ================= boot ================= */
firebase.initializeApp(firebaseConfig);
auth=firebase.auth();db=firebase.firestore();
if(INBOX)startInbox();else renderPublic();
</script>
</body></html>
